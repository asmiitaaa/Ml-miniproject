<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Corridor — HSR Layout</title>
<style>
  :root{
    --surface-1:#fcfcfb; --surface-2:#f3f2ef;
    --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#787771;
    --line:#e4e2dc; --good:#008300;
  }
  @media (prefers-color-scheme: dark){
    :root{--surface-1:#1a1a19;--surface-2:#232322;--text-primary:#f0efec;
          --text-secondary:#c3c2b7;--text-muted:#8f8e86;--line:#3a3936;--good:#58b658}
    #map polyline{stroke:#55534e}
  }
  *{box-sizing:border-box;margin:0}
  body{font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,Arial,sans-serif;
       background:var(--surface-1);color:var(--text-primary);line-height:1.5}
  main{max-width:1060px;margin:0 auto;padding:32px 20px 56px}
  h1{font-size:24px}
  .sub{font-size:13px;color:var(--text-muted)}
  .stats{display:flex;gap:16px;flex-wrap:wrap;margin:16px 0}
  .stat{background:var(--surface-2);border-radius:10px;padding:10px 18px;min-width:140px}
  .stat b{font-size:22px;display:block}
  .stat span{font-size:12px;color:var(--text-secondary)}
  .mapwrap{background:var(--surface-2);border-radius:12px;padding:12px;margin-top:8px}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text-secondary);margin-top:10px}
  .chip{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:-1px}
  #status{font-size:13px;color:var(--text-muted);margin-top:8px}
</style>
</head>
<body>
<main>
  <h1>Live corridor — 17th Cross Road, HSR Layout</h1>
  <p class="sub">SUMO running headless via TraCI · every dot is one simulated vehicle · signal dots show live phase</p>

  <div class="stats">
    <div class="stat"><b id="s-time">–</b><span>simulated time</span></div>
    <div class="stat"><b id="s-running">–</b><span>vehicles on road</span></div>
    <div class="stat"><b id="s-wait">–</b><span>current waiting at signals (s)</span></div>
    <div class="stat"><b id="s-arrived">–</b><span>trips completed</span></div>
  </div>

  <div class="mapwrap" id="mapwrap">Loading map…</div>

  <div class="legend">
    <span><span class="chip" style="background:#eb6834"></span>motorcycle</span>
    <span><span class="chip" style="background:#eda100"></span>auto</span>
    <span><span class="chip" style="background:#2a78d6"></span>car</span>
    <span><span class="chip" style="background:#008300"></span>bus</span>
    <span><span class="chip" style="background:#1baf7a"></span>bicycle</span>
    <span style="margin-left:12px"><span class="chip" style="background:#22a06b"></span>/<span class="chip" style="background:#d93025;margin-left:4px"></span> signal green / red</span>
  </div>
  <p id="status"></p>
</main>

<script>
const SVG_NS = "http://www.w3.org/2000/svg";
let vehLayer, tlsLayer;

async function init(){
  const svgText = await (await fetch("/map.svg")).text();
  document.getElementById("mapwrap").innerHTML = svgText;
  vehLayer = document.getElementById("veh-layer");
  tlsLayer = document.getElementById("tls-layer");
  poll();
}

async function poll(){
  try{
    const s = await (await fetch("/state")).json();
    const m = Math.floor(s.time/60), sec = String(Math.floor(s.time%60)).padStart(2,"0");
    document.getElementById("s-time").textContent = `${m}:${sec}`;
    document.getElementById("s-running").textContent = s.running;
    document.getElementById("s-wait").textContent = s.waiting_now;
    document.getElementById("s-arrived").textContent = s.arrived;

    vehLayer.replaceChildren(...s.vehicles.map(([x,y,c])=>{
      const dot = document.createElementNS(SVG_NS,"circle");
      dot.setAttribute("cx",x); dot.setAttribute("cy",y);
      dot.setAttribute("r",2.6); dot.setAttribute("fill",c);
      return dot;
    }));
    tlsLayer.replaceChildren(...s.tls.map(([x,y,c])=>{
      const dot = document.createElementNS(SVG_NS,"circle");
      dot.setAttribute("cx",x); dot.setAttribute("cy",y);
      dot.setAttribute("r",6); dot.setAttribute("fill",c);
      dot.setAttribute("stroke","var(--surface-2)"); dot.setAttribute("stroke-width",2);
      return dot;
    }));
    document.getElementById("status").textContent =
      s.done ? "Simulation finished — restart live_server.py to replay." : "";
    setTimeout(poll, s.done ? 2000 : 120);
  }catch(e){
    document.getElementById("status").textContent =
      "Waiting for simulation server… (is live_server.py running?)";
    setTimeout(poll, 1000);
  }
}
init();
</script>
</body>
</html>
